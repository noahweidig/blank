name: Release

# Every push to main is a release: the minor version is bumped, committed back
# to main, tagged, built and published, and installed apps pick it up through
# the in-app updater. Docs-only pushes are skipped.
on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  workflow_dispatch:
    inputs:
      prerelease:
        description: 'Mark as a pre-release. GitHub keeps releases/latest off these, so installed apps do not update to it.'
        type: boolean
        required: false
        default: false

# The release job pushes a GitHub Release, so it needs write access.
permissions:
  contents: write

# Releases queue rather than race: two bumps computed from the same version
# would collide on the tag.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    # Universal binary covers both Apple Silicon and Intel Macs in one .app,
    # so there is only one download for users to choose from.
    runs-on: macos-15
    name: macOS

    env:
      # Signing is enabled only when a certificate actually exists. See the
      # "Enable Apple code signing" step for why this matters.
      HAS_APPLE_CERT: ${{ secrets.APPLE_CERTIFICATE != '' }}
      HAS_UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      # Compiling the Liquid Glass icon (icons/Blank.icon) needs actool from
      # Xcode 26; older Xcodes fail the bundle step.
      - name: Select Xcode 26
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"

      # Diagnostic only. icons/Blank.icon is out of bundle.icon until actool
      # accepts it: Tauri reports just "actool did not generate Assets.car",
      # so compile it here and print what actool actually says.
      - name: Check Liquid Glass icon (non-fatal)
        continue-on-error: true
        run: |
          xcodebuild -version
          mkdir -p "$RUNNER_TEMP/icon"
          xcrun actool src-tauri/icons/Blank.icon \
            --compile "$RUNNER_TEMP/icon" \
            --platform macosx --minimum-deployment-target 11.0 \
            --app-icon Blank \
            --output-partial-info-plist "$RUNNER_TEMP/icon/partial.plist" \
            --output-format human-readable-text --errors --warnings --notices
          ls -la "$RUNNER_TEMP/icon"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # Both targets are required for the universal macOS binary.
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      # Rust builds are slow from cold; this takes repeat runs from ~15 min to
      # a few minutes.
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          key: macos-15-universal-apple-darwin

      - run: npm ci

      # Fail before the slow Rust compile if the web layer is broken.
      - name: Typecheck and unit tests
        run: |
          npm run typecheck
          npm run test

      # The bump commit is pushed with GITHUB_TOKEN, and GitHub never starts a
      # workflow from a push made with that token, so this cannot loop.
      - name: Bump minor version and tag
        id: version
        run: |
          git pull --ff-only origin main
          version=$(node scripts/bump-version.mjs)
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -am "Release $version"
          git tag "v$version"
          git push origin HEAD:main "v$version"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      # Same rule as Apple signing below: the updater key must not exist at
      # all unless it is configured, or the bundler fails on a blank key.
      - name: Enable updater artifacts
        if: env.HAS_UPDATER_KEY == 'true'
        run: |
          {
            echo "TAURI_SIGNING_PRIVATE_KEY<<__EOF__"
            echo "${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}"
            echo "__EOF__"
            echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}"
            echo 'UPDATER_ARGS=--config src-tauri/tauri.updater.conf.json'
          } >> "$GITHUB_ENV"

      # Tauri reads APPLE_CERTIFICATE with std::env::var_os, which returns
      # Some("") for a variable that is DEFINED BUT EMPTY — as an unset GitHub
      # secret is. It then tries to import a blank certificate and the bundle
      # step dies. So the variables must not exist at all unless signing is
      # genuinely configured, which is why they are written here rather than
      # passed unconditionally in the build step's env block.
      - name: Enable Apple code signing
        if: env.HAS_APPLE_CERT == 'true'
        run: |
          {
            echo "APPLE_CERTIFICATE<<__EOF__"
            echo "${{ secrets.APPLE_CERTIFICATE }}"
            echo "__EOF__"
            echo "APPLE_CERTIFICATE_PASSWORD=${{ secrets.APPLE_CERTIFICATE_PASSWORD }}"
            echo "APPLE_SIGNING_IDENTITY=${{ secrets.APPLE_SIGNING_IDENTITY }}"
            echo "APPLE_ID=${{ secrets.APPLE_ID }}"
            echo "APPLE_PASSWORD=${{ secrets.APPLE_PASSWORD }}"
            echo "APPLE_TEAM_ID=${{ secrets.APPLE_TEAM_ID }}"
          } >> "$GITHUB_ENV"

      - name: Build and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ steps.version.outputs.tag }}
          releaseName: 'Blank __VERSION__'
          releaseBody: |
            Download the `.dmg` below. Works on both Apple Silicon and Intel.

            These builds are unsigned unless signing secrets are configured, so
            the first launch is blocked. This is expected. Click **Done** (not "Move to Bin"), then open
            **System Settings → Privacy & Security**, scroll to Security and click
            **Open Anyway** next to Blank. Once only. Note the older
            right-click → Open trick no longer works on macOS 15 and later.
          # Published, not draft: a draft release's assets 404 for anyone who is
          # not the repo owner, which would break every shared download link.
          releaseDraft: false
          # A test build cut from a branch must not become releases/latest:
          # every link to the latest release would hand out the experimental one.
          prerelease: ${{ github.event.inputs.prerelease == 'true' }}
          args: --target universal-apple-darwin ${{ env.UPDATER_ARGS }}
